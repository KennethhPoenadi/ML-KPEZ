model:
  name: shared_conv_cnn
  input_shape: [96, 96, 3]
  num_classes: 6
  conv_filters: [32, 64]
  kernel_sizes: [3, 3]
  pooling_type: max
  dense_units: [128]
  dropout_rate: 0.3
  learning_rate: 0.001
  activation: relu

training:
  train_dir: data/raw/intel_image_classification/seg_train/seg_train
  validation_dir:
  output_dir: models/keras/cnn
  history_dir: artifacts/experiments/cnn
  image_size: [96, 96]
  batch_size: 64
  epochs: 5
  validation_split: 0.2
  seed: 42
  early_stopping_patience: 1
